name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: v2.9.5

# Each job's name is a required status check in the `Protect main` ruleset. Renaming, adding or
# removing a job, or changing a matrix, needs the ruleset updated in the same change; see
# docs/repository-settings.md.
jobs:
  static-checks-and-unit-tests:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: extispex
          POSTGRES_PASSWORD: extispex
          POSTGRES_DB: extispex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U extispex"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno install --frozen
      - run: deno fmt --check
      - run: deno lint
      - run: deno check
      - name: Import rules between services and between modules of a service
        run: deno task test:architecture
      - name: Unit and service tests on SQLite and PostgreSQL
        run: deno task test
        env:
          # Each service's tests create their own database <service>_test on this server.
          TEST_POSTGRES_URL: postgresql://extispex:extispex@localhost:5432/extispex

  end-to-end-tests:
    name: End-to-end tests (${{ matrix.deployment }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deployment: [all-in-one, services]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: extispex
          POSTGRES_PASSWORD: extispex
          POSTGRES_DB: extispex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U extispex"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno install --frozen
      - name: Install Chromium
        run: .github/scripts/install-browser.sh
        timeout-minutes: 40
      - run: deno task build:web
      # Started here and not under `services:`, which cannot give a container a command or a
      # file from the checkout.
      - name: Start Keycloak for the OIDC tests
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -v "$PWD/tests/e2e/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4.7 start-dev --import-realm
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:8180/realms/extispex/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: deno task test:e2e
        env:
          E2E_DEPLOYMENT: ${{ matrix.deployment }}
          # Each service creates its own database <service>_e2e on this server.
          E2E_POSTGRES_URL: postgresql://extispex:extispex@localhost:5432/extispex
          E2E_OIDC_ISSUER_URL: http://localhost:8180/realms/extispex

  container-images:
    name: Container images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno install --frozen
      - name: Install Chromium
        run: .github/scripts/install-browser.sh
        timeout-minutes: 40
      - name: Build images
        run: |
          docker build -f deploy/docker/all-in-one.Dockerfile -t ghcr.io/gallas-ai/extispex:ci .
          docker build -f deploy/docker/telemetry.Dockerfile -t ghcr.io/gallas-ai/extispex-telemetry:ci .
          docker build -f deploy/docker/gateway.Dockerfile -t ghcr.io/gallas-ai/extispex-gateway:ci .
          docker build -f deploy/docker/prompt.Dockerfile -t ghcr.io/gallas-ai/extispex-prompt:ci .
          docker build -f deploy/docker/identity.Dockerfile -t ghcr.io/gallas-ai/extispex-identity:ci .
          docker build -f deploy/docker/evaluation.Dockerfile -t ghcr.io/gallas-ai/extispex-evaluation:ci .
          docker build -f deploy/docker/evaluation-worker.Dockerfile -t ghcr.io/gallas-ai/extispex-evaluation-worker:ci .
      - name: Start the all-in-one image as an arbitrary user, as OpenShift does
        run: |
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/certs/key.pem" -out "$RUNNER_TEMP/certs/cert.pem"
          chmod 644 "$RUNNER_TEMP"/certs/*.pem
          docker run -d --name all-in-one --user 1000870000:0 \
            -p 4317:4317 -p 4318:4318 -p 8080:8080 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@e2e.extispex.test \
            -e BOOTSTRAP_ADMIN_PASSWORD=e2e-admin-password \
            -e BOOTSTRAP_PROJECT_API_KEY=extispex_e2eProjectApiKey00000000000000000000000 \
            -e TELEMETRY_GRPC_TLS_CERTIFICATE_FILE=/certs/cert.pem \
            -e TELEMETRY_GRPC_TLS_PRIVATE_KEY_FILE=/certs/key.pem \
            -e EVALUATION_TELEMETRY_POLL_INTERVAL_MILLISECONDS=200 \
            -e EVALUATION_ROOT_SPAN_SETTLE_MILLISECONDS=500 \
            -e EVALUATION_ROOT_SPAN_TIMEOUT_MILLISECONDS=3000 \
            -e DATA_LIFECYCLE_INTERVAL_MILLISECONDS=1000 \
            ghcr.io/gallas-ai/extispex:ci
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          docker logs all-in-one
          exit 1
      - name: End-to-end tests against the container
        run: deno task test:e2e
        env:
          E2E_DEPLOYMENT: external
          E2E_GATEWAY_URL: http://127.0.0.1:8080
          E2E_OTLP_HTTP_URL: http://127.0.0.1:4318
          E2E_OTLP_GRPC_ADDRESS: localhost:4317
          E2E_API_KEY: extispex_e2eProjectApiKey00000000000000000000000
          E2E_ADMIN_EMAIL: admin@e2e.extispex.test
          E2E_ADMIN_PASSWORD: e2e-admin-password
          E2E_GRPC_ROOT_CERTIFICATE_FILE: ${{ runner.temp }}/certs/cert.pem
      - name: Container logs
        if: failure()
        run: docker logs all-in-one
