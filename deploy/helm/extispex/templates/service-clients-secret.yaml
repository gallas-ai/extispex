{{- if not .Values.serviceClients.existingSecret }}
{{- $name := include "extispex.serviceClientsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "extispex.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range list "telemetry" "prompt" "evaluation" }}
  {{- if and $existing (index $existing.data .) }}
  {{ . }}: {{ index $existing.data . }}
  {{- else }}
  {{ . }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
