# Production-like deployment with separate services and PostgreSQL, for development.
# Start from the repository root:
#   docker compose -f deploy/compose/compose.yaml up --build
# Override host ports with OTLP_GRPC_HOST_PORT, OTLP_HTTP_HOST_PORT and GATEWAY_HOST_PORT.
#
# The Instance admin key and the first Project's API key default to development values that
# everyone can read here. Override them with INSTANCE_ADMIN_KEY and BOOTSTRAP_PROJECT_API_KEY
# (at least 32 characters each) before anyone else can reach the ports.
#
# One PostgreSQL server hosts a separate database for each service. Each service creates its own
# database on first start, which needs a user that may create databases.
name: extispex

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: extispex
      POSTGRES_PASSWORD: extispex
      POSTGRES_DB: extispex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extispex"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  identity:
    build:
      context: ../..
      dockerfile: deploy/docker/identity.Dockerfile
    environment:
      IDENTITY_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/identity
      INSTANCE_ADMIN_KEY: ${INSTANCE_ADMIN_KEY:-development-instance-admin-key-not-for-production}
      BOOTSTRAP_PROJECT_API_KEY: ${BOOTSTRAP_PROJECT_API_KEY:-development-project-api-key-not-for-production}
    # No published port: the internal API key resolution must stay inside the network.
    depends_on:
      postgres:
        condition: service_healthy

  telemetry:
    build:
      context: ../..
      dockerfile: deploy/docker/telemetry.Dockerfile
    environment:
      TELEMETRY_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/telemetry
      IDENTITY_URL: http://identity:8082
    ports:
      - "${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OTLP_HTTP_HOST_PORT:-4318}:4318"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started

  prompt:
    build:
      context: ../..
      dockerfile: deploy/docker/prompt.Dockerfile
    environment:
      PROMPT_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/prompt
      IDENTITY_URL: http://identity:8082
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      TELEMETRY_URL: http://telemetry:4318
      PROMPT_URL: http://prompt:8081
      IDENTITY_URL: http://identity:8082
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - telemetry
      - prompt
      - identity

volumes:
  postgres-data:
