# Production-like deployment with separate services and PostgreSQL, for development.
# Start from the repository root:
#   docker compose -f deploy/compose/compose.yaml up --build
# Override host ports with OTLP_GRPC_HOST_PORT, OTLP_HTTP_HOST_PORT and GATEWAY_HOST_PORT.
#
# The first administrator's password, the first Project's API key and the services' client secrets
# default to development values that everyone can read here. Override BOOTSTRAP_ADMIN_PASSWORD (at
# least 12 characters), BOOTSTRAP_PROJECT_API_KEY and the *_CLIENT_SECRET variables (at least 32
# characters each) before anyone else can reach the ports. Sign in to the UI as
# admin@extispex.local, or as BOOTSTRAP_ADMIN_EMAIL.
#
# Local accounts are enabled here. Production signs users in through the company's identity
# provider once OIDC exists; until then, LOCAL_ACCOUNTS=enabled is the only way to sign in.
#
# One PostgreSQL server hosts a separate database for each service. Each service creates its own
# database on first start, which needs a user that may create databases.
name: extispex

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: extispex
      POSTGRES_PASSWORD: extispex
      POSTGRES_DB: extispex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extispex"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  identity:
    build:
      context: ../..
      dockerfile: deploy/docker/identity.Dockerfile
    environment:
      IDENTITY_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/identity
      LOCAL_ACCOUNTS: enabled
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@extispex.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-development-admin-password}
      BOOTSTRAP_PROJECT_API_KEY: ${BOOTSTRAP_PROJECT_API_KEY:-development-project-api-key-not-for-production}
      SERVICE_CLIENTS: telemetry:${TELEMETRY_CLIENT_SECRET:-development-telemetry-client-secret-0000},prompt:${PROMPT_CLIENT_SECRET:-development-prompt-client-secret-00000000},evaluation:${EVALUATION_CLIENT_SECRET:-development-evaluation-client-secret-000}
    # No published port: the internal endpoints for tokens and API keys stay inside the network.
    depends_on:
      postgres:
        condition: service_healthy

  telemetry:
    build:
      context: ../..
      dockerfile: deploy/docker/telemetry.Dockerfile
    environment:
      TELEMETRY_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/telemetry
      IDENTITY_URL: http://identity:8082
      IDENTITY_CLIENT_SECRET: ${TELEMETRY_CLIENT_SECRET:-development-telemetry-client-secret-0000}
    ports:
      - "${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OTLP_HTTP_HOST_PORT:-4318}:4318"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started

  prompt:
    build:
      context: ../..
      dockerfile: deploy/docker/prompt.Dockerfile
    environment:
      PROMPT_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/prompt
      IDENTITY_URL: http://identity:8082
      IDENTITY_CLIENT_SECRET: ${PROMPT_CLIENT_SECRET:-development-prompt-client-secret-00000000}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started

  evaluation:
    build:
      context: ../..
      dockerfile: deploy/docker/evaluation.Dockerfile
    environment:
      EVALUATION_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/evaluation
      IDENTITY_URL: http://identity:8082
      IDENTITY_CLIENT_SECRET: ${EVALUATION_CLIENT_SECRET:-development-evaluation-client-secret-000}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started

  evaluation-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/evaluation-worker.Dockerfile
    environment:
      EVALUATION_DATABASE_URL: postgresql://extispex:extispex@postgres:5432/evaluation
    depends_on:
      postgres:
        condition: service_healthy
      evaluation:
        condition: service_started

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      TELEMETRY_URL: http://telemetry:4318
      PROMPT_URL: http://prompt:8081
      IDENTITY_URL: http://identity:8082
      EVALUATION_URL: http://evaluation:8083
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - telemetry
      - prompt
      - identity
      - evaluation

volumes:
  postgres-data:
